name: Release

# Pushing a version tag (v1.2.0) builds the Windows installers and the Linux
# packages, signs the updater artifacts and opens a draft release with them and latest.json.
# Publishing the draft is what makes installed apps see the update.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing is built or published unless every test passes
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The oldest Ubuntu still supported, so the packages run on as many
      # distributions as possible
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Vocal Teleprompter ${{ github.ref_name }}
          releaseBody: See the release notes below.
          releaseDraft: true
          prerelease: false

      # Same installer under a name that never changes, so a plain link to
      # releases/latest/download/VocalTeleprompter-Setup.exe always works
      - name: Upload installer with a fixed name
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*-setup.exe VocalTeleprompter-Setup.exe
          gh release upload "${{ github.ref_name }}" VocalTeleprompter-Setup.exe --clobber

      - name: Upload AppImage with a fixed name
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/bundle/appimage/*.AppImage VocalTeleprompter.AppImage
          gh release upload "${{ github.ref_name }}" VocalTeleprompter.AppImage --clobber
