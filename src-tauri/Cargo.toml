[package]
name = "vocal-teleprompter"
version = "1.5.0"
description = "Voice-synced teleprompter that scrolls your script as you speak"
authors = ["FaureGalliard"]
license = "MIT"
repository = "https://github.com/FaureGalliard/vocal-teleprompter"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vocal_teleprompter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
ureq = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: rewriting an assistant's config keeps its keys in place
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
vosk = "0.3"
cpal = "0.18"
ureq = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
xcap = "0.9"

[target.'cfg(windows)'.dependencies]
# When the user last clicked, typed or scrolled, to look behind the window right then,
# and the windows behind it painting themselves, so recordings never see it blink
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
vosk = "0.3"
